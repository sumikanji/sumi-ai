<body>
  <main class="wrap">
    <div class="topbar">
      <a href="index.html" class="back-btn" id="back-btn">← Về cấp học</a>
      <div class="top-title">👯 Chữ sinh đôi</div>
      <div class="top-xp" id="top-prog">0/10</div>
    </div>

    <section class="tw-card" id="tw-start">
      <div id="tw-start-hiyo"></div>
      <h1>Chữ sinh đôi</h1>
      <p>Nhiều chữ Hán trông na ná nhau: 未 và 末, 土 và 士, 人 và 入… Chọn đúng chữ theo nghĩa, rồi xem <b>mẹo phân biệt</b> để không bao giờ nhầm nữa.</p>
      <div class="tw-pool" id="tw-pool">
        <button data-v="learned">Chữ đã học <small></small></button>
        <button data-v="fav">❤️ Yêu thích <small></small></button>
        <button data-v="open">Chữ đang mở <small></small></button>
      </div>
      <button class="act-btn primary tw-go" id="tw-go">▶ Bắt đầu 10 câu</button>
      <p class="tw-note" id="tw-note"></p>
    </section>

    <section class="tw-card tw-play" id="tw-play" hidden>
      <div class="tw-q" id="tw-q"></div>
      <div class="tw-opts" id="tw-opts"></div>
      <div class="tw-reveal" id="tw-reveal" hidden></div>
    </section>

    <section class="tw-card" id="tw-end" hidden></section>
  </main>
